seo:
  title: Vheins - Enterprise Digital Solutions
  description: Premier technology partner for ERP systems, SaaS platforms, and AI automation. We build scalable solutions for modern enterprises.
hero:
  title: Building Scalable [Digital Solutions]{.text-primary}
  description: We are a technology consultancy specializing in ERP development, Cloud Infrastructure, and AI-driven automation. We transform business operations into efficient digital ecosystems.
  links:
    - label: Our Services
      icon: i-lucide-arrow-right
      trailing: true
      color: primary
      to: '#services'
      size: xl
    - label: Business Inquiry
      icon: i-lucide-mail
      size: xl
      color: neutral
      variant: outline
      to: '#contact'
section:
  title: 'Our [Philosophy]{.text-primary}'
  description: We believe in engineering excellence and operational efficiency. Our mission is to empower businesses with technology that solves real-world problems.
  features:
    - title: Strategic Innovation
      description: We analyze your business processes to identify bottlenecks and implement strategic digital solutions that drive growth.
      class: border-l border-primary pl-4
    - title: Precision Engineering
      description: Our team adheres to strict quality standards, ensuring every line of code serves a purpose and every system is built for stability.
      class: border-l border-default pt-4 pl-4
    - title: Scalable Architecture
      description: We design systems that grow with your business, utilizing modern cloud infrastructure and microservices patterns.
      class: border-l border-default pt-4 pl-4
features:
  title: Our [Capabilities]{.text-primary}
  description: Comprehensive technology services designed for enterprise needs.
  features:
    - title: ERP System Development
      description: Custom ERP solutions integrated with Odoo to streamline your business operations.
      icon: i-lucide-database
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: SaaS Platform Engineering
      description: End-to-end development of scalable Software-as-a-Service platforms.
      icon: i-lucide-layout-grid
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: AI & Automation
      description: Intelligent process automation and machine learning integration for data-driven insights.
      icon: i-lucide-bot
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Cloud Infrastructure
      description: Robust DevOps solutions using Docker, Kubernetes, and high-availability architecture.
      icon: i-lucide-cloud
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: API Integration
      description: Seamless operational connectivity between your disparate business systems.
      icon: i-lucide-network
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Technology Consulting
      description: Strategic guidance on technology stack selection, architecture, and digital transformation.
      icon: i-lucide-users
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
steps:
  title: Our [Trajection]{.text-primary}
  description: A history of delivering excellence in technology and operations.
  items:
    - title: Operational Foundation
      description: Rooted in enterprise retail operations, we understand the complexities of logistics, inventory, and supply chain management at scale.
      image:
        light: '/images/light/connect.svg'
        dark: '/images/dark/connect.svg'
    - title: Technological Evolution
      description: Transitioning to full-stack development, we bridged the gap between operational needs and technical possibilities.
      image:
        light: '/images/light/optimize.svg'
        dark: '/images/dark/optimize.svg'
    - title: Enterprise Solutions Partner (Present)
      description: Today, we serve diverse industries by delivering robust, high-performance software solutions that power mission-critical processes.
      image:
        light: '/images/light/track.svg'
        dark: '/images/dark/track.svg'
projects:
  title: Client [Success Stories]{.text-primary}
  description: How we have helped businesses achieve their digital transformation goals.
  plans:
    - title: Enterprise ERP Integration
      description: A unified resource planning system for a large-scale logistics company.
      price: Retail & Logistics
      features:
        - Custom Odoo Module Development
        - Real-time Inventory Sync
        - Automated Financial Reporting
        - Multi-warehouse Management
        - Automated Workflow Triggers
        - Comprehensive User Access Control
      button:
        label: View Case Study
        color: neutral
        variant: outline
        to: '#'
    - title: AI Analytics Platform
      description: Predictive analytics dashboard for a fintech startup.
      price: Fintech
      highlight: true
      features:
        - Real-time Fraud Detection
        - User Behavior Analysis
        - Predictive Financial Modeling
        - High-frequency Data Processing
        - Machine Learning Pipeline
        - Interactive Visualization
      button:
        label: View Case Study
        variant: subtle
        to: '#'
    - title: High-Availability Cloud
      description: Infrastructure modernization for a growing SaaS provider.
      price: SaaS
      features:
        - Zero-downtime Deployment
        - Auto-scaling Kubernetes Cluster
        - Global Content Delivery Network
        - Database Replication & Failover
        - Infrastructure as Code (IaC)
        - 24/7 Monitoring & Alerting
      button:
        label: View Case Study
        color: neutral
        variant: outline
        to: '#'
